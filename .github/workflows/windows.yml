name: Windows build

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/windows-support
    tags:
      - "windows-v*"
  pull_request:
    branches:
      - feature/windows-support
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build on Windows 2022 (MSVC)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.8.3 with Qt WebEngine
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true

      - name: Install libssh2
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
          & "$vcpkgRoot\vcpkg.exe" install libssh2:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg failed to install libssh2" }
          $prefix = Join-Path $vcpkgRoot "installed\x64-windows"
          "INCLUDE=$prefix\include;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIB=$prefix\lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KODIGUI_VCPKG_BIN=$prefix\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build KodiGui
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Deploy Qt and native runtime
        shell: pwsh
        run: |
          $dist = "dist/kodigui-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          # Return path strings here; an unquoted .\path\file.exe is parsed as a command invocation.
          $exeCandidates = @(
            (Join-Path $PWD "release\kodigui.exe"),
            (Join-Path $PWD "kodigui.exe")
          )
          $exe = $exeCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path $PWD -Filter "kodigui.exe" -File -Recurse |
              Where-Object { $_.FullName -notmatch "[\\/]dist[\\/]" } |
              Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $exe) { throw "kodigui.exe not found after build. Searched release, project root, and build subdirectories." }
          Write-Host "[KodiGui] Deploying executable: $exe"
          Copy-Item -LiteralPath $exe -Destination $dist
          windeployqt --release --compiler-runtime --no-translations --dir $dist "$dist\kodigui.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          Get-ChildItem "$env:KODIGUI_VCPKG_BIN" -Filter "*.dll" |
            Where-Object { $_.Name -match "^(libssh2|libcrypto|libssl|zlib).*\.dll$" } |
            Copy-Item -Destination $dist
          Copy-Item README.md $dist
          if (Test-Path LICENSE) { Copy-Item LICENSE $dist }

      - name: Verify portable package
        shell: pwsh
        run: |
          $dist = "dist/kodigui-windows-x86_64"
          if (-not (Test-Path "$dist\kodigui.exe")) { throw "Executable missing" }
          if (-not (Test-Path "$dist\Qt6Core.dll")) { throw "Qt runtime missing" }
          if (-not (Test-Path "$dist\platforms\qwindows.dll")) { throw "Windows platform plugin missing" }
          if (-not (Test-Path "$dist\QtWebEngineProcess.exe")) { throw "Qt WebEngine helper missing" }
          if (-not (Test-Path "$dist\resources\icudtl.dat")) { throw "Qt WebEngine resources missing" }

      - name: Create archive and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/kodigui-windows-x86_64" -DestinationPath "kodigui-windows-x86_64.zip" -Force
          $hash = (Get-FileHash "kodigui-windows-x86_64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  kodigui-windows-x86_64.zip" | Set-Content SHA256SUMS -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kodigui-windows-x86_64
          path: |
            kodigui-windows-x86_64.zip
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned tag build to GitHub Release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kodigui-windows-x86_64.zip
            SHA256SUMS
          generate_release_notes: true

  publish-preview:
    name: Publish Windows preview release
    needs: build-windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/windows-support'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: kodigui-windows-x86_64
          path: release-assets

      - name: Publish preview release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: windows-build-${{ github.run_number }}
          commit: ${{ github.sha }}
          name: KodiGui Windows build ${{ github.run_number }}
          body: |
            Automated Windows x86_64 preview build from feature/windows-support.

            Download the ZIP and verify it with the accompanying SHA256SUMS file.
          artifacts: release-assets/kodigui-windows-x86_64.zip,release-assets/SHA256SUMS
          artifactErrorsFailBuild: true
          prerelease: true
          makeLatest: false
          generateReleaseNotes: true
