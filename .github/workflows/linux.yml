name: Linux build

on:
  push:
    branches:
      - main
      - feature/linux-support
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - feature/linux-support
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Опубликовать GitHub Release после успешной сборки"
        required: true
        type: boolean
        default: false
      release_tag:
        description: "Тег релиза, например v1.0.0 (для ручной публикации)"
        required: false
        type: string
      release_name:
        description: "Название релиза (необязательно)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    name: Build on Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - name: Validate manual release inputs
        if: inputs.publish_release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Укажи тег релиза в формате v1.0.0."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config qt6-base-dev qt6-webengine-dev qt6-tools-dev-tools libssh2-1-dev

      - name: Build KodiGui
        run: bash ./scripts/build-linux.sh

      - name: Set up Python for bundled Streamlink
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build standalone Streamlink runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install streamlink pyinstaller
          cat > "$RUNNER_TEMP/kodigui_streamlink_entry.py" <<'PY'
          from streamlink_cli.main import main

          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          mkdir -p runtime
          python -m PyInstaller --noconfirm --clean --onefile --console \
            --name streamlink --distpath runtime \
            --workpath "$RUNNER_TEMP/streamlink-build" \
            --specpath "$RUNNER_TEMP" \
            --collect-all streamlink --collect-all streamlink_cli \
            --collect-all certifi "$RUNNER_TEMP/kodigui_streamlink_entry.py"
          test -x runtime/streamlink
          ./runtime/streamlink --version

      - name: Check executable dependencies
        run: |
          test -x ./kodigui
          ldd ./kodigui | tee ldd-report.txt
          if grep -q "not found" ldd-report.txt; then
            echo "Unresolved shared library dependencies detected."
            exit 1
          fi

      - name: Package Linux binary
        run: |
          mkdir -p dist/kodigui-linux-x86_64
          install -m 0755 ./kodigui dist/kodigui-linux-x86_64/kodigui
          install -D -m 0755 runtime/streamlink dist/kodigui-linux-x86_64/runtime/streamlink
          test -s libwidevinecdm/linux/libwidevinecdm.so
          install -D -m 0755 libwidevinecdm/linux/libwidevinecdm.so \
            dist/kodigui-linux-x86_64/libwidevinecdm/linux/libwidevinecdm.so
          cp README.md dist/kodigui-linux-x86_64/README.md
          cp ldd-report.txt dist/kodigui-linux-x86_64/
          tar -C dist -czf kodigui-linux-x86_64.tar.gz kodigui-linux-x86_64
          sha256sum kodigui-linux-x86_64.tar.gz > SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kodigui-linux-x86_64
          path: |
            kodigui-linux-x86_64.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.publish_release && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_name || (inputs.publish_release && inputs.release_tag) || github.ref_name }}
          files: |
            kodigui-linux-x86_64.tar.gz
            SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
